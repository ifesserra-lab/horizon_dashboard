name: Sync ETL Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 0"


concurrency:
  group: etl-data-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  ETL_OWNER: RafaelDeps
  ETL_REPO: horizon_etl
  ETL_BRANCH: main
  EXPORTS_DIR: data/exports

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Os pacotes vem de RafaelDeps/horizon_etl@main (data/exports), publicados
      # pelos workflows semanais do ETL (somente leitura; o ETL nao e alterado):
      #  - exports_parquet.zip (obrigatorio): tabelas e grafos em Parquet;
      #  - exports_canonical.zip (opcional): de onde vem so o que o Parquet nao
      #    cobre (grafos por grupo, arquivos de projetos).
      # Sem pacote Parquet, o job termina verde com um aviso (nada a sincronizar).
      - name: Resolve export zips from ETL data/exports
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_file="$(mktemp)"
          found="false"
          parquet_name=""
          canonical_name=""

          api_url="https://api.github.com/repos/${{ env.ETL_OWNER }}/${{ env.ETL_REPO }}/contents/${{ env.EXPORTS_DIR }}?ref=${{ env.ETL_BRANCH }}"

          download() {
            local name="$1" out="$2" url
            url="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .download_url' "$manifest_file")"
            [[ -n "$url" && "$url" != "null" ]] && curl -fSL "$url" -o "$out"
          }

          if curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url" > "$manifest_file" 2>/dev/null; then

            # Pacote Parquet: o ultimo zip com "parquet" no nome.
            parquet_name="$(jq -r '
              map(select(.type == "file" and (.name | contains("parquet") and endswith(".zip"))))
              | sort_by(.name) | last | .name // empty
            ' "$manifest_file")"

            # Pacote canonico, mesma preferencia de antes, ignorando o Parquet:
            # 1) canonical_export_YYYYMMDD_HHMMSS.zip; 2) "canonical" no nome.
            canonical_name="$(jq -r '
              (( map(select(.type == "file" and (.name | test("^canonical_export_[0-9]{8}_[0-9]{6}\\.zip$")))) | sort_by(.name) | last )
                // ( map(select(.type == "file" and (.name | contains("canonical") and endswith(".zip")))) | sort_by(.name) | last )
              ).name // empty
            ' "$manifest_file")"

            if [[ -n "$parquet_name" ]] && download "$parquet_name" "${RUNNER_TEMP}/etl_parquet.zip"; then
              found="true"
              if [[ -n "$canonical_name" ]] && download "$canonical_name" "${RUNNER_TEMP}/etl_canonical.zip"; then
                :
              else
                canonical_name=""
              fi
            fi
          fi

          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [[ "$found" == "true" ]]; then
            echo "zip_name=$parquet_name" >> "$GITHUB_OUTPUT"
            echo "canonical_name=$canonical_name" >> "$GITHUB_OUTPUT"
            echo "Pacote Parquet: $parquet_name"
            echo "Pacote canonico: ${canonical_name:-(ausente)}"
          else
            echo "Nenhum pacote Parquet encontrado em ${{ env.ETL_OWNER }}/${{ env.ETL_REPO }}/${{ env.EXPORTS_DIR }}; sync ignorado."
          fi

      # Node 22.15+ tem zstd em node:zlib (usado para regravar o Parquet
      # normalizado); as dependencias sao necessarias ja na preparacao dos dados.
      - name: Setup Node
        if: steps.zip.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.zip.outputs.found == 'true'
        run: npm ci

      # Overlay do Parquet sobre src/data (nunca apaga a pasta), remocao dos JSON
      # que viraram Parquet, copia so do que o canonico tem a mais, sanitize,
      # normalizacao de nomes (Parquet e JSON) e verificacao: nenhum arquivo
      # >= 100 MiB, sidecars, partes de grafo e Parquet legivel.
      # Veja scripts/sync-etl-data.sh.
      - name: Prepare src/data from ETL packages
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          canonical=""
          [[ -f "${RUNNER_TEMP}/etl_canonical.zip" ]] && canonical="${RUNNER_TEMP}/etl_canonical.zip"
          scripts/sync-etl-data.sh "${RUNNER_TEMP}/etl_parquet.zip" $canonical

      - name: Detect data changes
        id: changed
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          # git diff ignora arquivos untracked/ignorados;
          # usa status porcelana para detectar tambem arquivos novos no pacote.
          # Obs.: evita `grep -q` (fecha o pipe cedo -> SIGPIPE -> pipefail) e
          # `grep -v` sem protetor (exit 1 quando nada sobra -> set -e aborta).
          changed_files="$(git status --porcelain -- src/data | grep -v 'src/data/_meta.json' || true)"
          if [[ -n "$changed_files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate production build
        if: steps.changed.outputs.changed == 'true'
        run: npm run build
        env:
          # Runner de 16 GB: com heap de 24 GB o V8 adia o GC e estoura a RAM.
          # Com 10 GB o build local passa com pico de 10,7 GB.
          BUILD_HEAP_MB: 10240

      - name: Commit synced data
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Carimbo de frescor do dado (UTC), lido pela home em src/pages/index.astro.
          printf '{\n  "generated_at": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/data/_meta.json

          git add -A src/data
          git commit -m "chore(data): sync ETL exports"
          git push origin "HEAD:${{ github.ref_name }}"

          {
            echo "## Data sync summary"
            echo
            echo "Pacote Parquet: \`${{ env.ETL_REPO }}/${{ env.EXPORTS_DIR }}/${{ steps.zip.outputs.zip_name }}\`"
            echo
            echo "Pacote canonico: \`${{ steps.zip.outputs.canonical_name || '(ausente)' }}\`"
            echo
            echo "Files changed under \`src/data\`:"
            echo
            echo '```'
            git show --stat --oneline HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # O push feito pelo sync usa o GITHUB_TOKEN padrao, que NAO aciona
      # workflows `on: push` (regra do GitHub). Para garantir o redeploy,
      # dispara o deploy.yml explicitamente via workflow_dispatch (excecao
      # permitida com GITHUB_TOKEN desde 2022-09).
      - name: Trigger deploy after data sync
        if: steps.changed.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });

      - name: No export zip published yet
        if: steps.zip.outputs.found != 'true'
        run: |
          echo "O ETL ainda nao publica o pacote Parquet em \`${{ env.EXPORTS_DIR }}\`. Nenhuma sincronizacao realizada; o job conclui verde propositalmente."
          echo "## Data sync: nada a sincronizar" >> "$GITHUB_STEP_SUMMARY"
          echo "O ETL ainda nao publicou o pacote Parquet em \`${{ env.ETL_OWNER }}/${{ env.ETL_REPO }}/${{ env.EXPORTS_DIR }}\`. O sync sera ignorado ate existir um zip." >> "$GITHUB_STEP_SUMMARY"

      - name: No data changes
        if: steps.zip.outputs.found == 'true' && steps.changed.outputs.changed != 'true'
        run: echo "Nenhuma alteracao encontrada em src/data."
